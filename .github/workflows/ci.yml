name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep JAX from grabbing the whole device and keep CI runs deterministic.
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  JAX_PLATFORMS: "cpu"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

  typecheck:
    name: Type Check (advisory)
    runs-on: ubuntu-latest
    # pcx carries a pre-existing baseline of type errors from its dynamic pytree
    # design. This job reports them without blocking; flip to a hard gate once the
    # baseline reaches zero.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run ty
        run: uv run ty check

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # --python overrides the .python-version pin so the matrix leg actually
      # takes effect; --frozen is omitted because the lock resolves per-interpreter.
      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run coverage run --parallel-mode -m pytest -v

      - name: Upload coverage data
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true

  jax-compat:
    name: jax ${{ matrix.jax }}
    runs-on: ubuntu-latest
    # The lockfile pins one jax per Python version, so the OS/Python matrix above
    # exercises exactly two of them. That is how the pxf.vmap breakage (BUGS.md#4)
    # went unnoticed for a year: `jax = "^0.4.33"` permitted newer releases while
    # the committed lock pinned 0.4.33, so the maintainers never ran what users
    # installed. This job resolves *outside* the lock, against the range the
    # package actually claims to support.
    strategy:
      fail-fast: false
      matrix:
        # oldest declared, a mid-range release, and whatever is current
        jax: ["0.4.33", "0.6.2", ""]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run the suite against jax ${{ matrix.jax || 'latest' }}
        env:
          JAX_SPEC: ${{ matrix.jax && format('jax=={0}', matrix.jax) || 'jax' }}
        run: |
          uv run --isolated --no-project --python 3.12 \
            --with "$JAX_SPEC" --with equinox --with optax \
            --with pytest --with jaxtyping --with . \
            python -m pytest -p no:cacheprovider

  known-bugs:
    name: Known Defects (advisory)
    runs-on: ubuntu-latest
    # Every test here asserts correct behaviour that a catalogued defect
    # currently violates, so this job is expected to fail. It exists to make the
    # backlog visible and to flag when a defect is fixed. See BUGS.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run the known-defect catalogue
        run: uv run pytest -m bug -v

  coverage:
    name: Coverage Report
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and report
        run: |
          uv run coverage combine
          uv run coverage xml
          uv run coverage report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Verify the wheel installs and imports on a clean interpreter
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "import pcx; print(pcx.__name__, 'ok')"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
